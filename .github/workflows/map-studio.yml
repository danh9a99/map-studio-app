# Map Studio installers: on a tag v<version> (the version in desktop/app/package.json), build on macOS (Apple
# Silicon) and Windows, then one job puts every file on a GitHub Release (the app updates itself from it).
# Also runnable by hand: the installers are then only in the run's artifacts.
name: Map Studio

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6

      - name: Install packages
        run: |
          npm ci
          npm ci --prefix desktop
          npm ci --prefix desktop/app

      - name: Check the scripts
        shell: bash
        run: python -m py_compile scripts/drone-map.py scripts/track.py scripts/mapcolor.py scripts/colorgrade.py scripts/segment.py

      - name: Build the app folder
        run: npm run build --prefix desktop

      # unsigned for now; add CSC_LINK / CSC_KEY_PASSWORD (and APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) to sign
      - name: Package
        working-directory: desktop
        shell: bash
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-studio-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: warn

  # one release, written once: two builds publishing at the same time trip over each other
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
